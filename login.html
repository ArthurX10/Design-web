
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Lidy Variedades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="login-split-container">
        <div class="login-split-left" style="background-image: url('img/login-bg.png');">
            <div class="login-split-left-content">
                <h2 class="login-left-title login-left-title-white">Sua Beleza</h2>
                <h2 class="login-left-title login-left-title-pink">Nossa missão</h2>
                <p class="login-left-subtitle">Descubra produtos incríveis para realçar sua beleza.</p>
            </div>
        </div>
        <div class="login-split-right">
            <div class="login-form-wrapper">
                <div class="login-header">
                    <a href="index.html" class="login-brand">Lidy Variedades</a>
                    <h1 class="login-title">Bem-Vinda de Volta!</h1>
                </div>
                <form action="admin-produtos.html" method="GET" class="login-form">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" required class="form-control" placeholder="seu@email.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <input type="password" id="password" required class="form-control" placeholder="••••••••">
                    </div>
                    <div class="login-options">
                        <label class="login-remember-me">
                            <input type="checkbox" class="login-checkbox"> Lembra-me
                        </label>
                        <a href="#" class="login-forgot-password">Esqueci minha senha</a>
                    </div>
                    <button type="submit" class="btn btn-login-submit">Entrar</button>
                    <div class="login-divider">OU</div>
                    <button type="button" onclick="alert('Logado com Google (Demo)!'); window.location.href='admin-produtos.html';" class="btn btn-outline btn-google-login">
                        <svg width="18" height="18" viewBox="0 0 24 24" class="google-icon">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.23-.67-.35-1.37-.35-2.09z" />
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>
                        Continue com o Google
                    </button>
                    <div class="login-signup-prompt">
                        Não tem conta? <a href="#" class="login-signup-link">Crie uma agora</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
    window.onload = () => {
        lucide.createIcons();
        };
    </script>
</body>

</html>
